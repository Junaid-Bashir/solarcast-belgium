name: Validate and publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpypi-validation
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Junaid-Bashir/solarcast-belgium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      wheel_sha256: ${{ steps.hashes.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.hashes.outputs.sdist_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          url = f'https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?head_sha={sha}&event=push'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request) as response:
              runs = json.load(response)['workflow_runs']
          assert any(run['head_sha'] == sha and run['head_branch'] == 'main'
                     and run['status'] == 'completed' and run['conclusion'] == 'success'
                     for run in runs), 'Successful CI is required for the exact source commit'
          print('Verified successful CI for', sha)
          PY
      - name: Install validation tooling
        run: python -m pip install -e ".[dev]" twine cffconvert
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest
      - run: python scripts/check_docs.py
      - run: cffconvert --validate
      - run: python -m build
      - run: python scripts/check_distributions.py
      - run: python -m twine check dist/*
      - run: python scripts/check_wheel.py
      - name: Record exact candidate hashes
        id: hashes
        run: |
          wheel=dist/solarcast_belgium-0.1.0-py3-none-any.whl
          sdist=dist/solarcast_belgium-0.1.0.tar.gz
          echo "wheel_sha256=$(sha256sum "$wheel" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "sdist_sha256=$(sha256sum "$sdist" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          sha256sum "$wheel" "$sdist" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testpypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'Junaid-Bashir/solarcast-belgium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testpypi-distributions
          path: dist
      - name: Verify the exact verified build artifacts
        env:
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          printf '%s  %s\n' "$WHEEL_SHA256" dist/solarcast_belgium-0.1.0-py3-none-any.whl "$SDIST_SHA256" dist/solarcast_belgium-0.1.0.tar.gz | sha256sum --check
      - name: Publish to TestPyPI only
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
