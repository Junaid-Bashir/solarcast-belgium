[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "solarcast-belgium"
version = "0.1.0"
description = "Python toolkit for benchmarking energy forecasting models, starting with Belgian day-ahead solar PV."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md"]
keywords = ["energy forecasting", "time series", "solar", "photovoltaic", "machine learning", "foundation models", "Belgium", "Elia"]
dependencies = ["httpx>=0.28,<1", "pandas>=2.2,<4", "tzdata>=2025.1", "numpy>=1.26,<3", "pvlib>=0.13,<0.17"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/Junaid-Bashir/solarcast-belgium"
Documentation = "https://junaid-bashir.github.io/solarcast-belgium/"
Issues = "https://github.com/Junaid-Bashir/solarcast-belgium/issues"

[project.optional-dependencies]
weather = ["eccodes>=2.50,<2.51", "pyarrow>=26,<27", "shapely>=2.2,<2.3", "pyproj>=3.7,<4"]
lightgbm = ["lightgbm>=4.6,<5"]
chronos = ["chronos-forecasting>=2.3.2,<2.4"]
t0 = ["tfc-t0[torch]>=0.6.1,<0.7"]
experiments = ["lightgbm>=4.6,<5", "matplotlib>=3.10,<4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2", "pandas-stubs>=2.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/solarcast"]

[tool.hatch.build.targets.sdist]
include = ["/mkdocs.yml", "/.gitattributes", "/src", "/tests", "/docs", "/examples", "/scripts", "/configs", "/notebooks", "/README.md", "/CONTRIBUTING.md", "/CITATION.cff", "/CHANGELOG.md", "/SECURITY.md", "/THIRD_PARTY.md", "/LICENSE", "/pyproject.toml"]
exclude = ["/AGENTS.md", "/docs/public-api-implementation-report.md", "/docs/release/preparation-report.md", "/docs/release/release-candidate-audit.md", "/docs/release/github-v0.1-checklist.md", "/docs/release/public-candidate-files.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
markers = ["integration: opt-in real TSFM model download/inference, disabled by default"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
# pvlib has no py.typed marker; exempt only this external import boundary.
module = ["pvlib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional dependency may be absent in the base-only CI environment.
module = ["lightgbm"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional heavy imports stay confined to the Chronos adapter boundary.
module = ["chronos", "torch", "huggingface_hub", "t0"]
ignore_missing_imports = true
